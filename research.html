---
layout: default
---

<div class="posts">
  {% for post in site.posts %}
    {% if post.path contains 'research' %}
      <article class="post">

        <h1 style="margin-bottom:1px;margin-top:5%;font-size:120%"><a href="{{ post.link }}" target="_blank">{{ post.title }}</a></h1>

        <h4 style="margin-top:1px;font-size:80%;">{{post.date | date: "%B, %Y"}} | {{post.topic}}</h4>

        <div class="entry" style="margin-left: 5%;">
        {{ post.description }}
        </div>

        <!-- <img src="{{ post.image }}" height="300"> -->

        <!--<a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>-->
      </article>
    {% endif %}
  {% endfor %}
</div>
